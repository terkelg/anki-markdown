<link rel="stylesheet" href="./_review.css" />
<div class="anki-md-wrapper">
  <div class="front"></div>
  <div class="back"></div>
</div>
<!-- prettier-ignore -->
<script id="data-front" type="text/plain">{{Front}}</script>
<!-- prettier-ignore -->
<script id="data-back" type="text/plain">{{Back}}</script>
<script>
  {
    const ready = import("./_review.js").then(({ render }) => {
      const front = document.getElementById("data-front").textContent;
      const back = document.getElementById("data-back").textContent;
      render(front, back);
    });
    // Let Anki typeset after Markdown is inserted, without waiting for highlighting.
    if (typeof onUpdateHook !== "undefined") onUpdateHook.push(() => ready);
  }
</script>
