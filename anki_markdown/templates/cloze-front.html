<link rel="stylesheet" href="./_review.css" />
<div class="anki-md-wrapper">
  <div class="front"></div>
</div>
<!-- Anki requires {{cloze:Text}} in the template to generate cards per cloze number.
     Hidden because we render cloze ourselves in JS from the raw {{Text}} field below. -->
<div style="display: none">{{cloze:Text}}</div>
<!-- prettier-ignore -->
<script id="data-text" type="text/plain">{{Text}}</script>
<!-- prettier-ignore -->
<script id="data-extra" type="text/plain">{{Extra}}</script>
<script>
  {
    const ready = import("./_review.js").then(({ renderCloze }) => {
      const text = document.getElementById("data-text").textContent;
      const extra = document.getElementById("data-extra").textContent;
      const ord = parseInt(document.querySelector(".card")?.className.match(/card(\d+)/)?.[1] || "1");
      renderCloze(text, extra, ord, "front");
    });
    // Let Anki typeset after Markdown is inserted, without waiting for highlighting.
    if (typeof onUpdateHook !== "undefined") onUpdateHook.push(() => ready);
  }
</script>
